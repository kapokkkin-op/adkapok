<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapok</title>
<meta name="theme-color" content="#8e0203">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kapok">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fdfdfd;--surface:#ffffff;--ink:#8e0203;--muted:#a34545;--line:#eadede;
  --accent:#8e0203;--accent-ink:#ffffff;--tile1:#f6e6e6;--tile2:#f3ede6;--tile3:#efe3e4;--tile4:#f8eeee;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans','Courier New',ui-monospace,monospace;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:48px 0 28px}
h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.05;margin:0 0 12px;font-weight:700;letter-spacing:0}
header p{margin:0;color:var(--muted);max-width:46ch;font-size:1.05rem}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 0 24px}
input[type=search]{flex:1 1 220px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--ink);opacity:.9}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600}
.cat{color:var(--muted);font-size:.9rem}
.price{font-weight:700;font-size:1.2rem;margin-top:6px}
.old{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.9rem;margin-left:6px}
.buy{margin-top:auto;padding:10px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-align:center;text-decoration:none;font-weight:600}
.buy.sold{background:var(--line);color:var(--muted);pointer-events:none}
.card .buy{margin-top:12px}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.95rem}
footer a{color:var(--ink)}

[hidden]{display:none!important}
button.buy{border:0;font:inherit;font-weight:600;cursor:pointer;width:100%}
body.has-cart{padding-bottom:84px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 12px;font-size:1.5rem;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;color:var(--ink);font:inherit;font-size:1.6rem;cursor:pointer;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600}
.row .p{color:var(--muted);font-size:.95rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;padding:14px 0}
.panel label{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 4px}
.panel input,.panel textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.panel textarea{min-height:64px;resize:vertical}
.panel .buy{display:block;margin-top:16px}
.clear{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kapok</h1>
    <p>Light, soft, well-chosen finds at honest prices. Message us on WhatsApp to order.</p>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="Search products" aria-label="Search products">
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    <div>Order on WhatsApp: <a id="wa" href="#"></a></div>
    
  </footer>
</div>

<button class="cartbar" id="cartbar" hidden><span id="cartcount"></span><span id="carttotal"></span></button>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ct">
    <h2><span id="ct">Your cart</span><button class="x" id="close" aria-label="Close cart">&times;</button></h2>
    <div id="items"></div>
    <div class="total"><span>Total</span><span id="sum"></span></div>
    <label for="cname">Your name (optional)</label>
    <input id="cname" autocomplete="name">
    <label for="cnote">Delivery address or note (optional)</label>
    <textarea id="cnote"></textarea>
    <a class="buy" id="send" href="#" target="_blank" rel="noopener">Send order on WhatsApp</a>
    <button class="clear" id="clear">Clear cart</button>
  </div>
</div>

<script>
/* ===== EDIT THIS SECTION ===== */
var PHONE = "919895267767";            // WhatsApp number with country code, no + or spaces
var PRODUCTS = [
  /* Add products like this:
  {name:"Product name", cat:"Category", price:499, old:799, img:""}, */
];
/* ============================= */

var tiles=["var(--tile1)","var(--tile2)","var(--tile3)","var(--tile4)"];
var active="All", grid=document.getElementById("grid"), chips=document.getElementById("chips"), q=document.getElementById("q");
var cats=["All"].concat(PRODUCTS.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
var cart={};
try{cart=JSON.parse(localStorage.getItem("kapok-cart")||"{}")||{}}catch(e){cart={}}
var $=function(id){return document.getElementById(id)};

function inr(n){return "\u20B9"+n.toLocaleString("en-IN")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function find(n){for(var i=0;i<PRODUCTS.length;i++){if(PRODUCTS[i].name===n)return PRODUCTS[i]}return null}
function save(){try{localStorage.setItem("kapok-cart",JSON.stringify(cart))}catch(e){}}
function clean(){Object.keys(cart).forEach(function(n){var p=find(n);if(!p||p.sold||!(cart[n]>0))delete cart[n]})}
function names(){return Object.keys(cart)}
function count(){return names().reduce(function(s,n){return s+cart[n]},0)}
function total(){return names().reduce(function(s,n){return s+find(n).price*cart[n]},0)}

function message(){
  var L=["Hi Kapok, I would like to order:",""];
  names().forEach(function(n,i){var p=find(n);L.push((i+1)+". "+n+" x"+cart[n]+" - "+inr(p.price*cart[n]))});
  L.push("","Total: "+inr(total()));
  var nm=$("cname").value.trim(), nt=$("cnote").value.trim();
  if(nm)L.push("Name: "+nm);
  if(nt)L.push("Address / note: "+nt);
  return L.join("\n");
}
function updateBar(){
  clean();
  var c=count();
  $("cartbar").hidden=!c;
  document.body.classList.toggle("has-cart",!!c);
  $("cartcount").textContent="View cart ("+c+" item"+(c===1?"":"s")+")";
  $("carttotal").textContent=inr(total());
}
function renderCart(){
  clean();
  if(!count()){$("sheet").hidden=true;updateBar();return}
  $("items").innerHTML=names().map(function(n){
    var p=find(n);
    return '<div class="row"><div class="t"><div class="n">'+esc(n)+'</div><div class="p">'+inr(p.price)+' each</div></div>'+
      '<div class="qty"><button data-act="minus" data-name="'+esc(n)+'" aria-label="Remove one">-</button><span>'+cart[n]+'</span><button data-act="plus" data-name="'+esc(n)+'" aria-label="Add one">+</button></div></div>';
  }).join("");
  $("sum").textContent=inr(total());
  $("send").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(message());
  updateBar();
}
function openCart(){renderCart();if(count())$("sheet").hidden=false}
function closeCart(){$("sheet").hidden=true}

function renderChips(){
  chips.innerHTML="";
  cats.forEach(function(c){
    var b=document.createElement("button");
    b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===active);
    b.onclick=function(){active=c;renderChips();render()};
    chips.appendChild(b);
  });
}
function render(){
  if(!PRODUCTS.length){
    document.querySelector('.bar').style.display='none';
    grid.innerHTML='<div class="empty"><strong>Our first products are on the way.</strong><br>Message us on WhatsApp to ask what is coming.</div>';
    return;
  }
  var term=q.value.trim().toLowerCase();
  var list=PRODUCTS.filter(function(p){
    return (active==="All"||p.cat===active)&&p.name.toLowerCase().indexOf(term)>-1;
  });
  if(!list.length){grid.innerHTML='<div class="empty">No products match. Try another search or category.</div>';return}
  grid.innerHTML=list.map(function(p,i){
    var thumb=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'">':esc(p.name.charAt(0));
    return '<article class="card"><div class="thumb" style="background:'+tiles[PRODUCTS.indexOf(p)%4]+'">'+thumb+'</div>'+
      '<div class="body"><div class="name">'+esc(p.name)+'</div><div class="cat">'+esc(p.cat)+'</div>'+
      '<div class="price">'+inr(p.price)+(p.old?'<span class="old">'+inr(p.old)+'</span>':'')+'</div>'+
      (p.sold?'<span class="buy sold">Sold out</span>':'<button class="buy" data-add="'+esc(p.name)+'">Add to cart</button>')+
      '</div></article>';
  }).join("");
}

q.addEventListener("input",render);
grid.addEventListener("click",function(e){
  var b=e.target.closest("[data-add]");if(!b)return;
  var n=b.getAttribute("data-add");
  cart[n]=Math.min((cart[n]||0)+1,99);save();updateBar();
  b.textContent="Added \u2713";setTimeout(function(){b.textContent="Add to cart"},900);
});
$("items").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var n=b.getAttribute("data-name");
  cart[n]=(cart[n]||0)+(b.getAttribute("data-act")==="plus"?1:-1);
  if(cart[n]>99)cart[n]=99;
  if(cart[n]<=0)delete cart[n];
  save();renderCart();
});
$("cartbar").addEventListener("click",openCart);
$("close").addEventListener("click",closeCart);
$("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))closeCart()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCart()});
$("cname").addEventListener("input",renderCart);
$("cnote").addEventListener("input",renderCart);
$("clear").addEventListener("click",function(){cart={};save();renderCart()});
var wa=$("wa");wa.textContent="+"+PHONE;wa.href="https://wa.me/"+PHONE;
renderChips();render();updateBar();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}
</script>
</body>
</html>
